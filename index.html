<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0e1726"/>
<title>Our Garage</title>
<style>
:root{--navy:#0b1220;--navy2:#17243b;--paper:#f5f1ea;--card:#fffdf9;--ink:#162033;--muted:#758093;--line:#e6ded1;--brass:#c89a4b;--copper:#b97957;--ok:#2f7d5c;--warn:#b56c1f;--bad:#b34d4a;--shadow:0 18px 55px rgba(15,23,42,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 0 0,rgba(200,154,75,.12),transparent 28rem),radial-gradient(circle at 100% 10%,rgba(185,121,87,.10),transparent 26rem),linear-gradient(180deg,#faf8f4 0%,var(--paper) 55%,#eee7db 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(12,18,32,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(12,18,32,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 72%)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1180px;margin:0 auto;padding:22px 18px 110px;position:relative}
.topbar{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:18px;margin:6px 0 22px;padding:24px 26px;border-radius:30px;color:#fff;background:radial-gradient(circle at 86% 18%,rgba(201,154,75,.35),transparent 22rem),linear-gradient(135deg,var(--navy),#1a2942 72%);box-shadow:0 24px 60px rgba(9,17,31,.20)}
.topbar:after{content:"";position:absolute;right:-40px;bottom:-74px;width:260px;height:160px;border:1px solid rgba(255,255,255,.10);border-radius:50%;transform:rotate(-10deg)}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.brandmark{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-weight:900;letter-spacing:.04em;color:var(--navy);background:linear-gradient(145deg,#f7e7bd,#c79542);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 22px rgba(0,0,0,.18)}
h1,h2,h3,p{margin:0}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:800}.topbar .eyebrow{color:#aeb9c9}.title{font-size:clamp(28px,4vw,42px);line-height:1.02;letter-spacing:-.045em}.topbar .title{font-size:clamp(26px,3.6vw,38px)}.sub{color:var(--muted);margin-top:5px;line-height:1.5}
.grid{display:grid;gap:16px}.cars{grid-template-columns:repeat(2,minmax(0,1fr))}.card{position:relative;background:rgba(255,253,249,.94);border:1px solid rgba(221,212,198,.92);border-radius:24px;box-shadow:0 8px 24px rgba(15,23,42,.06);padding:19px;overflow:hidden;backdrop-filter:blur(10px);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d9cbb8}.car-card{padding:0}.car-card .car-inner{padding:20px}.car-card:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--brass),#e9cd91,var(--copper))}
.car-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.plate{display:inline-flex;align-items:center;min-height:34px;background:#f5d447;color:#111;border:2px solid #1d1d1d;border-radius:7px;padding:6px 12px;font:900 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 5px 12px rgba(0,0,0,.08)}.plate.front{background:#fbfaf2}.meta{color:var(--muted);font-size:13px;margin-top:7px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.status{position:relative;border-radius:16px;background:linear-gradient(180deg,#f8f5ef,#f1ece4);padding:11px;border:1px solid rgba(220,211,198,.72)}.status small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:750}.status strong{display:block;font-size:12px;margin-top:5px;line-height:1.35}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--ok);box-shadow:0 0 0 3px rgba(47,125,92,.10)}.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(181,108,31,.11)}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(179,77,74,.11)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;background:linear-gradient(180deg,#f5ead1,#ead7af);color:#6d4924;border:1px solid #dfc99c}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--navy),#1c2c48);color:white;min-height:44px;box-shadow:0 8px 18px rgba(15,23,42,.13);transition:transform .15s ease}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:#ece6dc;color:var(--ink);box-shadow:none}.btn.ghost{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:none}
.section{margin-top:21px}.section-title,.panel-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:11px}.section-title h2,.panel-title h2{font-size:19px;letter-spacing:-.025em}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{min-height:118px;background:radial-gradient(circle at 85% 12%,rgba(200,154,75,.11),transparent 8rem),rgba(255,253,249,.95)}.kpi .big{font-size:28px;font-weight:900;letter-spacing:-.045em;margin-top:8px}.kpi .small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:750}.notice{border-left:4px solid var(--warn);background:#fff8e8;padding:13px 14px;border-radius:14px}.next-list,.list{display:grid;gap:0}.next,.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.next:last-child,.listrow:last-child{border-bottom:0}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(650px,calc(100% - 24px));background:rgba(10,18,31,.96);border:1px solid rgba(255,255,255,.08);border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;box-shadow:0 24px 60px rgba(8,15,27,.30);z-index:20;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#aeb7c5;border-radius:15px;padding:9px 4px;font-size:11px}.nav button.active{background:linear-gradient(180deg,#fff,#f4efe7);color:var(--navy);font-weight:850;box-shadow:0 8px 18px rgba(0,0,0,.15)}.tab-icon{display:block;font-size:18px;margin-bottom:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd4c7;background:#fff;border-radius:13px;padding:12px;font:inherit;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#bc9a69;box-shadow:0 0 0 3px rgba(188,154,105,.12)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cdbfae;border-radius:18px;background:rgba(255,255,255,.45)}
.modalback{position:fixed;inset:0;background:rgba(8,14,24,.64);display:grid;place-items:end center;padding:16px;z-index:30;backdrop-filter:blur(8px)}.modal{background:linear-gradient(180deg,#fffdf9,#f6f1e9);width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:28px;padding:19px;box-shadow:0 30px 90px rgba(0,0,0,.34)}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,rgba(200,154,75,.18),transparent 26rem),radial-gradient(circle at 100% 100%,rgba(185,121,87,.14),transparent 25rem),linear-gradient(145deg,#0a1220,#17243a 68%,#22324b)}.login{max-width:930px;width:100%;display:grid;grid-template-columns:1.12fr .88fr;gap:16px;align-items:stretch}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 80% 20%,rgba(211,173,103,.34),transparent 18rem),linear-gradient(140deg,#0a1220,#20304b 78%);color:#fff;border-radius:32px;padding:34px;box-shadow:0 28px 80px rgba(0,0,0,.28);min-height:480px;display:flex;flex-direction:column;justify-content:space-between}.hero:before{content:"";position:absolute;right:-80px;top:70px;width:310px;height:160px;border-radius:50%;border:1px solid rgba(255,255,255,.12);transform:rotate(-12deg)}.hero:after{content:"";position:absolute;right:-10px;bottom:-70px;width:280px;height:170px;border-radius:50%;border:1px solid rgba(255,255,255,.08);transform:rotate(8deg)}.hero p{color:#c6ced9;margin-top:10px;max-width:520px;line-height:1.6}.hero-preview{position:relative;z-index:1;margin-top:28px;padding:14px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}.hero-preview .minirow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.10)}.hero-preview .minirow:last-child{border-bottom:0}.hero-preview .minilabel{color:#aeb9c8;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.hero-preview strong{font-size:13px}.login>.card{border-radius:32px;padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 28px 80px rgba(0,0,0,.16)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#ece7de;border-radius:14px;padding:4px;margin:17px 0 20px}.auth-tabs button{border:0;border-radius:10px;background:transparent;padding:10px;font-weight:800;color:var(--muted)}.auth-tabs button.active{background:white;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.08)}.alert{margin-top:10px;border-radius:13px;padding:11px 12px;background:#fff6dd;font-size:13px}.alert.err{background:#fdebea;color:#8c3434}.alert.ok{background:#e9f5ee;color:#276047}.small{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}.quickgrid{display:grid;gap:9px}.quickcall{display:flex;justify-content:space-between;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:linear-gradient(180deg,#faf7f1,#f2ece3);border:1px solid var(--line);border-radius:15px;padding:13px 14px;min-height:58px}.quickcall strong{font-size:15px}.file-pill,.tag{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef1f5;color:#34445b}.attention{border-left:4px solid var(--warn);padding-left:11px}.verified{color:var(--ok)}.unverified{color:var(--warn)}.settingsline{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.settingsline:last-child{border-bottom:0}
@media(max-width:820px){.login{grid-template-columns:1fr;max-width:520px}.hero{min-height:auto;padding:28px}.hero-preview{margin-top:22px}}
@media(max-width:760px){.cars,.kpis,.form-grid{grid-template-columns:1fr}.shell{padding:12px 12px 100px}.card{padding:16px;border-radius:20px}.topbar{align-items:flex-start;padding:20px;border-radius:24px}.topbar .toolbar{justify-content:flex-end}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:1/-1}.kpi .big{font-size:24px}}
@media(max-width:430px){.status-grid{gap:6px}.status{padding:9px 7px}.status strong{font-size:11px}.brandmark{width:42px;height:42px}.topbar .toolbar{display:none}.hero{padding:24px}.login>.card{padding:20px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/+esm';

const sb=createClient('https://cmojpokknnkbrkbbvlqg.supabase.co','sb_publishable_WRSPjJMaco9Z0VC2SohzOA_RA9MMN5B');
const root=document.querySelector('#root');
let mode='login';
let state={session:null,household:null,vehicles:[],contacts:[],recurring:[],expenses:[],services:[],docs:[],reminders:[],tab:'home'};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n||0));
const fmtDate=d=>d?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d.slice(0,10)+'T12:00:00Z')):'To confirm';
const daysTo=d=>d?Math.ceil((new Date(d.slice(0,10)+'T23:59:59Z')-new Date())/86400000):null;
const level=d=>{const n=daysTo(d);if(n===null)return 'warn';if(n<0)return 'bad';if(n<=35)return 'warn';return ''};
const reg=id=>state.vehicles.find(v=>v.id===id)?.registration||'General';

function renderAuth(){
 root.innerHTML=`<div class="loginwrap"><div class="login">
   <div class="hero">
     <div><div class="eyebrow" style="color:#d8c6a5">Private family vehicle hub</div><h1 class="title" style="font-size:44px;margin-top:6px">Our Garage</h1><p class="sub">A calmer way to keep MOTs, insurance, documents, costs and emergency help together — for both of you.</p></div>
     <div class="hero-preview"><div class="minirow"><span class="plate front">EF14 ABN</span><span><span class="minilabel">Next MOT</span><br><strong>4 Oct 2026</strong></span></div><div class="minirow"><span class="plate">FJ14 SMV</span><span><span class="minilabel">Insurance</span><br><strong>29 Oct 2026</strong></span></div><div class="minirow"><span class="minilabel">Shared securely</span><strong>2 people · 2 cars</strong></div></div>
   </div>
   <div class="card"><div class="eyebrow">Welcome</div><h2 style="font-size:28px;letter-spacing:-.03em;margin-top:5px">${mode==='login'?'Sign in':'Create your account'}</h2><p class="sub">${mode==='login'?'Open your shared family garage.':'Create your secure login, then connect to the shared garage.'}</p>
     <div class="auth-tabs"><button id="loginTab" class="${mode==='login'?'active':''}">Sign in</button><button id="signupTab" class="${mode==='signup'?'active':''}">Create account</button></div>
     <form id="authForm"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="${mode==='login'?'current-password':'new-password'}" required placeholder="At least 8 characters"></div><button class="btn" id="authSubmit" style="width:100%;margin-top:16px">${mode==='login'?'Sign in to Our Garage':'Create account'}</button></form><div id="authMsg"></div><p class="small" style="margin-top:16px;text-align:center">Your vehicle records and uploaded documents stay behind your login.</p>
   </div>
 </div></div>`;
 document.querySelector('#loginTab').onclick=()=>{mode='login';renderAuth()};
 document.querySelector('#signupTab').onclick=()=>{mode='signup';renderAuth()};
 document.querySelector('#authForm').onsubmit=async e=>{e.preventDefault();const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const btn=document.querySelector('#authSubmit');btn.disabled=true;const res=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});btn.disabled=false;const msg=document.querySelector('#authMsg');if(res.error){msg.innerHTML=`<div class="alert err">${esc(res.error.message)}</div>`;return}if(mode==='signup'&&!res.data.session){msg.innerHTML='<div class="alert ok">Account created. Check your email to confirm it, then return here and sign in.</div>';return}await route();};
}

function renderOnboarding(){
 root.innerHTML=`<div class="loginwrap"><div class="login">
 <div class="hero"><div class="eyebrow" style="color:#aeb9c7">Shared access</div><h1 class="title">Welcome</h1><p class="sub">Create the family garage once, then the second person joins it with the invite code.</p></div>
 <div class="card"><button id="create" class="btn" style="width:100%">Create Our Garage</button>
 <div style="text-align:center;color:var(--muted);margin:14px 0">or</div>
 <div class="field"><label>Invite code</label><input id="code" maxlength="20" placeholder="Enter code from Settings"></div>
 <button id="join" class="btn secondary" style="width:100%;margin-top:10px">Join existing garage</button><div id="msg"></div></div></div></div>`;
 document.querySelector('#create').onclick=async()=>{const r=await sb.rpc('bootstrap_garage',{p_name:'Our Garage'});if(r.error)return msg(r.error.message,true);await route()};
 document.querySelector('#join').onclick=async()=>{const c=document.querySelector('#code').value.trim();if(!c)return msg('Enter the invite code first.',true);const r=await sb.rpc('join_garage',{p_invite_code:c});if(r.error)return msg(r.error.message,true);await route()};
 function msg(t,e=false){document.querySelector('#msg').innerHTML=`<div class="alert ${e?'err':'ok'}">${esc(t)}</div>`}
}

async function route(){
 const {data:{session}}=await sb.auth.getSession();state.session=session;
 if(!session){state.household=null;renderAuth();return}
 const q=await sb.from('household_members').select('household_id,role,households(id,name,invite_code)').eq('user_id',session.user.id).limit(1);
 if(q.error){root.innerHTML=`<div class="loginwrap"><div class="card"><h2>Could not load garage</h2><p class="sub">${esc(q.error.message)}</p></div></div>`;return}
 if(!q.data?.length){renderOnboarding();return}
 state.household=q.data[0].households;await loadData();renderApp();
}

async function loadData(){
 const hid=state.household.id;
 const [v,c,r,e,s,d,rem]=await Promise.all([
   sb.from('vehicles').select('*').eq('household_id',hid).order('registration'),
   sb.from('emergency_contacts').select('*').eq('household_id',hid).order('sort_order'),
   sb.from('recurring_costs').select('*').eq('household_id',hid).eq('active',true),
   sb.from('expenses').select('*').eq('household_id',hid).order('expense_date',{ascending:false}).limit(100),
   sb.from('service_records').select('*').eq('household_id',hid).order('record_date',{ascending:false}).limit(100),
   sb.from('documents').select('*').eq('household_id',hid).order('created_at',{ascending:false}),
   sb.from('reminders').select('*').eq('household_id',hid).order('due_date')
 ]);
 const err=[v,c,r,e,s,d,rem].find(x=>x.error)?.error;if(err)throw err;
 Object.assign(state,{vehicles:v.data||[],contacts:c.data||[],recurring:r.data||[],expenses:e.data||[],services:s.data||[],docs:d.data||[],reminders:rem.data||[]});
}

function renderApp(){
 root.innerHTML=`<main class="shell"><div class="topbar"><div class="brand"><div class="brandmark">OG</div><div><div class="eyebrow">James family vehicle hub</div><h1 class="title">${esc(state.household.name)}</h1><div style="margin-top:5px;color:#b7c1cf;font-size:13px">Everything important, ready when you need it.</div></div></div><div class="toolbar"><button class="btn ghost" id="settings">Settings</button><button class="btn ghost" id="quick">Quick Help</button></div></div><div id="view"></div></main>
 <nav class="nav">${[['home','⌂','Home'],['cars','🚘','Cars'],['money','£','Money'],['documents','▤','Docs'],['help','☎','Help']].map(([k,i,l])=>`<button data-tab="${k}" class="${state.tab===k?'active':''}"><span class="tab-icon">${i}</span>${l}</button>`).join('')}</nav>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderApp()});
 document.querySelector('#settings').onclick=renderSettings;
 document.querySelector('#quick').onclick=()=>{state.tab='help';renderApp()};
 renderView();
}

function renderView(){
 const v=document.querySelector('#view');
 if(state.tab==='home')return renderHome(v); if(state.tab==='cars')return renderCars(v); if(state.tab==='money')return renderMoney(v); if(state.tab==='documents')return renderDocs(v); return renderHelp(v);
}
function carCard(c,detail=false){
 return `<article class="card car-card"><div class="car-inner"><div class="car-head"><div><span class="plate ${c.registration==='EF14 ABN'?'front':''}">${esc(c.registration)}</span><h3 style="margin-top:12px;font-size:19px;letter-spacing:-.02em">${esc(c.year+' '+c.make_model)}</h3><div class="meta">${esc([c.engine,c.transmission,c.colour].filter(Boolean).join(' · '))}</div></div><span class="pill">${esc(c.insurance_provider||'Insurance')}</span></div><div class="status-grid"><div class="status"><small>MOT</small><strong><i class="dot ${level(c.mot_expiry)}"></i>${fmtDate(c.mot_expiry)}</strong></div><div class="status"><small>Tax</small><strong><i class="dot ${c.tax_verified?level(c.tax_expiry):'warn'}"></i>${fmtDate(c.tax_expiry)}</strong></div><div class="status"><small>Insurance</small><strong><i class="dot ${level(c.insurance_expiry)}"></i>${fmtDate(c.insurance_expiry)}</strong></div></div>${detail?`<div class="list section"><div class="listrow"><span>Insurer</span><strong>${esc(c.insurer||'To confirm')}</strong></div><div class="listrow"><span>Cover</span><strong>${esc(c.insurance_cover||'To confirm')}</strong></div><div class="listrow"><span>Breakdown</span><strong>${esc(c.breakdown_cover||'To confirm')}</strong></div><div class="listrow"><span>Verification</span><strong>${c.tax_verified?'<span class="verified">Tax verified</span>':'<span class="unverified">Tax to confirm</span>'}</strong></div><button class="btn secondary editVehicle" data-id="${c.id}" style="margin-top:12px">Edit vehicle details</button></div>`:''}</div></article>`;
}

function renderHome(v){
 const m=calc();
 const upcoming=state.reminders.filter(r=>daysTo(r.due_date)>=0).slice(0,6);
 const needs=[];state.vehicles.forEach(c=>{if(!c.tax_expiry)needs.push(c.registration+' tax date');else if(!c.tax_verified)needs.push(c.registration+' tax verification');if(c.registration==='FJ14 SMV'&&!state.recurring.some(x=>x.vehicle_id===c.id&&x.category==='Insurance'))needs.push('FJ14 SMV insurance cost')});
 v.innerHTML=`<section class="grid cars">${state.vehicles.map(c=>carCard(c)).join('')}</section>
 <section class="section"><div class="grid kpis"><div class="card kpi"><div class="eyebrow">This month</div><div class="big">${money(m.thisMonth)}</div></div><div class="card kpi"><div class="eyebrow">Known monthly</div><div class="big">${money(m.avg)}</div></div><div class="card kpi"><div class="eyebrow">Projected annual</div><div class="big">${money(m.annual)}</div></div></div></section>
 <section class="section grid desktop-grid" style="grid-template-columns:1.2fr .8fr"><div class="card"><div class="panel-title"><h2>Next up</h2></div><div class="list">${upcoming.length?upcoming.map(r=>`<div class="listrow"><span>${esc(r.title)}</span><strong>${fmtDate(r.due_date)}</strong></div>`).join(''):'<div class="empty">Nothing upcoming.</div>'}</div></div>
 <div class="card"><div class="panel-title"><h2>Needs attention</h2></div><div class="list">${needs.length?needs.map(n=>`<div class="attention"><strong>${esc(n)}</strong><div class="small">To confirm</div></div>`).join(''):'<div class="empty">Nothing missing.</div>'}</div></div></section>`;
}
function renderCars(v){
 v.innerHTML=`<section class="grid cars">${state.vehicles.map(c=>carCard(c,true)).join('')}</section><section class="section"><div class="panel-title"><h2>Service & repair history</h2><button class="btn" id="addService">+ Add record</button></div><div class="card"><div class="list">${state.services.length?state.services.map(x=>`<div class="listrow"><span><strong>${esc(reg(x.vehicle_id))} · ${esc(x.category)}</strong><div class="small">${fmtDate(x.record_date)}${x.mileage?' · '+x.mileage+' miles':''}${x.supplier?' · '+esc(x.supplier):''}${x.note?' · '+esc(x.note):''}</div></span><strong>${x.amount!==null?money(x.amount):''}</strong></div>`).join(''):'<div class="empty">No service or repair records yet.</div>'}</div></div></section>`;
 document.querySelectorAll('.editcar').forEach(b=>b.onclick=()=>editVehicle(b.dataset.id));
 document.querySelector('#addService').onclick=addService;
}
function renderMoney(v){
 const m=calc();
 v.innerHTML=`<section class="grid kpis"><div class="card kpi"><div class="eyebrow">This month</div><div class="big">${money(m.thisMonth)}</div></div><div class="card kpi"><div class="eyebrow">Known monthly</div><div class="big">${money(m.avg)}</div></div><div class="card kpi"><div class="eyebrow">Projected annual</div><div class="big">${money(m.annual)}</div></div></section>
 <section class="section"><div class="panel-title"><h2>Recurring costs</h2><button class="btn" id="addRecurring">+ Add regular cost</button></div><div class="card"><div class="list">${state.recurring.length?state.recurring.map(x=>`<div class="listrow"><span><strong>${esc(reg(x.vehicle_id))} · ${esc(x.category)}</strong><div class="small">${esc(x.note||'')}</div></span><strong>${money(x.amount)} / ${esc(x.cadence)}</strong></div>`).join(''):'<div class="empty">No regular costs yet.</div>'}</div></div></section>
 <section class="section"><div class="panel-title"><h2>Recent expenses</h2><button class="btn" id="addExpense">+ Add expense</button></div><div class="card"><div class="list">${state.expenses.length?state.expenses.slice(0,25).map(x=>`<div class="listrow"><span><strong>${esc(reg(x.vehicle_id))} · ${esc(x.category)}</strong><div class="small">${fmtDate(x.expense_date)}${x.note?' · '+esc(x.note):''}</div></span><strong>${money(x.amount)}</strong></div>`).join(''):'<div class="empty">No one-off expenses yet.</div>'}</div></div></section>`;
 document.querySelector('#addExpense').onclick=addExpense;document.querySelector('#addRecurring').onclick=addRecurring;
}
function renderDocs(v){
 v.innerHTML=`<div class="panel-title"><h2>Documents</h2><button class="btn" id="upload">+ Upload</button></div><div class="notice">Documents are stored privately and require a signed-in household member.</div><section class="section grid cars">${state.vehicles.map(c=>{const ds=state.docs.filter(d=>d.vehicle_id===c.id);return `<article class="card"><span class="plate ${c.registration==='EF14 ABN'?'front':''}">${esc(c.registration)}</span><div class="list section">${ds.length?ds.map(d=>`<div class="listrow"><span><strong>${esc(d.label)}</strong><div class="small">${esc(d.doc_type)}</div></span>${d.storage_path?`<button class="btn secondary openDoc" data-id="${d.id}">Open</button>`:'<span class="file-pill">Held</span>'}</div>`).join(''):'<div class="empty">No documents.</div>'}</div></article>`}).join('')}</section>`;
 document.querySelector('#upload').onclick=uploadDoc;document.querySelectorAll('.openDoc').forEach(b=>b.onclick=()=>openDoc(b.dataset.id));
}
function renderHelp(v){
 v.innerHTML=`<section class="grid cars">${state.vehicles.map(c=>`<article class="card"><span class="plate ${c.registration==='EF14 ABN'?'front':''}">${esc(c.registration)}</span><h2 style="margin:12px 0 2px">${esc(c.insurance_provider||'Quick Help')}</h2><div class="small">${esc(c.breakdown_cover||'')}</div><div class="quickgrid section">${state.contacts.filter(x=>x.vehicle_id===c.id).map(x=>`<a class="quickcall" href="tel:${x.phone.replace(/\s/g,'')}"><span><strong>${esc(x.label)}</strong><div class="small">${esc(x.availability||'')}</div></span><strong>${esc(x.phone)}</strong></a>`).join('')}</div></article>`).join('')}</section>`;
}

function modal(title,body){
 const el=document.createElement('div');el.className='modalback';el.innerHTML=`<div class="modal"><div class="row"><h2>${esc(title)}</h2><button class="btn secondary close">Close</button></div>${body}</div>`;document.body.appendChild(el);el.querySelector('.close').onclick=()=>el.remove();return el;
}
function editVehicle(id){
 const c=state.vehicles.find(x=>x.id===id);const el=modal('Edit '+c.registration,`<form id="f" class="form-grid section"><div class="field"><label>MOT expiry</label><input name="mot_expiry" type="date" value="${c.mot_expiry||''}"></div><div class="field"><label>Tax expiry</label><input name="tax_expiry" type="date" value="${c.tax_expiry||''}"></div><div class="field"><label>MOT status</label><select name="mot_verified"><option value="true" ${c.mot_verified?'selected':''}>Verified</option><option value="false" ${!c.mot_verified?'selected':''}>Unverified</option></select></div><div class="field"><label>Tax status</label><select name="tax_verified"><option value="true" ${c.tax_verified?'selected':''}>Verified</option><option value="false" ${!c.tax_verified?'selected':''}>Unverified</option></select></div><div class="field"><label>Insurance provider</label><input name="insurance_provider" value="${esc(c.insurance_provider||'')}"></div><div class="field"><label>Insurance expiry</label><input name="insurance_expiry" type="date" value="${c.insurance_expiry?.slice(0,10)||''}"></div><div class="field" style="grid-column:1/-1"><label>Breakdown cover</label><input name="breakdown_cover" value="${esc(c.breakdown_cover||'')}"></div><div><button class="btn">Save changes</button></div></form>`);
 el.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),payload={mot_expiry:f.get('mot_expiry')||null,tax_expiry:f.get('tax_expiry')||null,mot_verified:f.get('mot_verified')==='true',tax_verified:f.get('tax_verified')==='true',insurance_provider:f.get('insurance_provider')||null,insurance_expiry:f.get('insurance_expiry')?f.get('insurance_expiry')+'T23:59:00Z':null,breakdown_cover:f.get('breakdown_cover')||null,updated_at:new Date().toISOString()};const r=await sb.from('vehicles').update(payload).eq('id',id);if(r.error)return alert(r.error.message);el.remove();await refresh()};
}
function addExpense(){
 const el=modal('Add expense',`<form id="f" class="form-grid section"><div class="field"><label>Car</label><select name="vehicle_id">${state.vehicles.map(c=>`<option value="${c.id}">${esc(c.registration)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="expense_date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Category</label><select name="category">${['Fuel','Service/repairs','MOT','Tyres','Parking/tolls','Tax','Insurance','Breakdown','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Amount (£)</label><input type="number" name="amount" min="0" step=".01" required></div><div class="field" style="grid-column:1/-1"><label>Note</label><input name="note"></div><div><button class="btn">Save expense</button></div></form>`);
 el.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await sb.from('expenses').insert({household_id:state.household.id,vehicle_id:f.get('vehicle_id'),expense_date:f.get('expense_date'),category:f.get('category'),amount:Number(f.get('amount')),note:f.get('note')||null});if(r.error)return alert(r.error.message);el.remove();await refresh()};
}
function addRecurring(){
 const el=modal('Add regular cost',`<form id="f" class="form-grid section"><div class="field"><label>Car</label><select name="vehicle_id">${state.vehicles.map(c=>`<option value="${c.id}">${esc(c.registration)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select name="category">${['Insurance','Tax','Fuel budget','Service/repairs fund','Breakdown','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Amount (£)</label><input type="number" name="amount" min="0" step=".01" required></div><div class="field"><label>Cadence</label><select name="cadence"><option value="monthly">Monthly</option><option value="annual">Annual</option></select></div><div class="field" style="grid-column:1/-1"><label>Note</label><input name="note"></div><div><button class="btn">Save regular cost</button></div></form>`);
 el.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await sb.from('recurring_costs').insert({household_id:state.household.id,vehicle_id:f.get('vehicle_id'),category:f.get('category'),amount:Number(f.get('amount')),cadence:f.get('cadence'),note:f.get('note')||null});if(r.error)return alert(r.error.message);el.remove();await refresh()};
}
function addService(){
 const el=modal('Add service / repair',`<form id="f" class="form-grid section"><div class="field"><label>Car</label><select name="vehicle_id">${state.vehicles.map(c=>`<option value="${c.id}">${esc(c.registration)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="record_date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Category</label><select name="category">${['Service','Repair','MOT','Tyres','Battery','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Mileage</label><input type="number" name="mileage" min="0"></div><div class="field"><label>Supplier</label><input name="supplier"></div><div class="field"><label>Cost (£)</label><input type="number" name="amount" min="0" step=".01"></div><div class="field" style="grid-column:1/-1"><label>Note</label><textarea name="note"></textarea></div><div><button class="btn">Save record</button></div></form>`);
 el.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await sb.from('service_records').insert({household_id:state.household.id,vehicle_id:f.get('vehicle_id'),record_date:f.get('record_date'),category:f.get('category'),mileage:f.get('mileage')?Number(f.get('mileage')):null,supplier:f.get('supplier')||null,amount:f.get('amount')?Number(f.get('amount')):null,note:f.get('note')||null});if(r.error)return alert(r.error.message);el.remove();await refresh()};
}
function uploadDoc(){
 const el=modal('Upload private document',`<form id="f" class="form-grid section"><div class="field"><label>Car</label><select name="vehicle_id">${state.vehicles.map(c=>`<option value="${c.id}">${esc(c.registration)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select name="doc_type">${['V5C','Insurance','MOT','Service invoice','Receipt','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>Label</label><input name="label" required></div><div class="field" style="grid-column:1/-1"><label>PDF or photo</label><input type="file" name="file" accept=".pdf,image/*" required></div><div><button class="btn">Upload securely</button></div></form>`);
 el.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get('file'),vid=f.get('vehicle_id');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=state.household.id+'/'+vid+'/'+Date.now()+'-'+safe;const up=await sb.storage.from('garage-docs').upload(path,file);if(up.error)return alert(up.error.message);const r=await sb.from('documents').insert({household_id:state.household.id,vehicle_id:vid,doc_type:f.get('doc_type'),label:f.get('label'),status:'uploaded',storage_path:path,uploaded_by:state.session.user.id});if(r.error)return alert(r.error.message);el.remove();await refresh()};
}
async function openDoc(id){const d=state.docs.find(x=>x.id===id);if(!d?.storage_path)return;const r=await sb.storage.from('garage-docs').createSignedUrl(d.storage_path,60);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,'_blank','noopener')}
function renderSettings(){
 const el=modal('Garage settings',`<div class="settingsline"><div><strong>Garage</strong><div class="small">${esc(state.household.name)}</div></div></div><div class="settingsline"><div><strong>Invite code</strong><div class="small">Give this only to Lara/Lyle after they create their account.</div></div><span class="plate">${esc(state.household.invite_code)}</span></div><div class="settingsline"><div><strong>Currency</strong><div class="small">GBP (£)</div></div></div><div class="settingsline"><div><strong>Signed in</strong><div class="small">${esc(state.session.user.email)}</div></div><button class="btn secondary" id="signout">Sign out</button></div>`);
 el.querySelector('#signout').onclick=async()=>{await sb.auth.signOut();el.remove();await route()};
}
async function refresh(){await loadData();renderApp()}
sb.auth.onAuthStateChange(()=>setTimeout(route,0));
route().catch(err=>{root.innerHTML=`<div class="loginwrap"><div class="card"><h2>Something went wrong</h2><p class="sub">${esc(err.message)}</p></div></div>`});
</script>
</body>
</html>
