<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2"/>
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=2"/>
<meta name="theme-color" content="#0e1726"/>
<title>Our Garage</title>
<style>
:root{--navy:#0b1220;--navy2:#17243b;--paper:#f5f1ea;--card:#fffdf9;--ink:#162033;--muted:#758093;--line:#e6ded1;--brass:#c89a4b;--copper:#b97957;--ok:#2f7d5c;--warn:#b56c1f;--bad:#b34d4a;--shadow:0 18px 55px rgba(15,23,42,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 0 0,rgba(200,154,75,.12),transparent 28rem),radial-gradient(circle at 100% 10%,rgba(185,121,87,.10),transparent 26rem),linear-gradient(180deg,#faf8f4 0%,var(--paper) 55%,#eee7db 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(12,18,32,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(12,18,32,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 72%)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1180px;margin:0 auto;padding:22px 18px 110px;position:relative}
.topbar{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:18px;margin:6px 0 22px;padding:24px 26px;border-radius:30px;color:#fff;background:radial-gradient(circle at 86% 18%,rgba(201,154,75,.35),transparent 22rem),linear-gradient(135deg,var(--navy),#1a2942 72%);box-shadow:0 24px 60px rgba(9,17,31,.20)}
.topbar:after{content:"";position:absolute;right:-40px;bottom:-74px;width:260px;height:160px;border:1px solid rgba(255,255,255,.10);border-radius:50%;transform:rotate(-10deg)}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.brandmark{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-weight:900;letter-spacing:.04em;color:var(--navy);background:linear-gradient(145deg,#f7e7bd,#c79542);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 22px rgba(0,0,0,.18)}
h1,h2,h3,p{margin:0}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:800}.topbar .eyebrow{color:#aeb9c9}.title{font-size:clamp(28px,4vw,42px);line-height:1.02;letter-spacing:-.045em}.topbar .title{font-size:clamp(26px,3.6vw,38px)}.sub{color:var(--muted);margin-top:5px;line-height:1.5}
.grid{display:grid;gap:16px}.cars{grid-template-columns:repeat(2,minmax(0,1fr))}.card{position:relative;background:rgba(255,253,249,.94);border:1px solid rgba(221,212,198,.92);border-radius:24px;box-shadow:0 8px 24px rgba(15,23,42,.06);padding:19px;overflow:hidden;backdrop-filter:blur(10px);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d9cbb8}.car-card{padding:0}.car-card .car-inner{padding:20px}.car-card:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--brass),#e9cd91,var(--copper))}
.car-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.plate{display:inline-flex;align-items:center;min-height:34px;background:#f5d447;color:#111;border:2px solid #1d1d1d;border-radius:7px;padding:6px 12px;font:900 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 5px 12px rgba(0,0,0,.08)}.plate.front{background:#fbfaf2}.meta{color:var(--muted);font-size:13px;margin-top:7px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.status{position:relative;border-radius:16px;background:linear-gradient(180deg,#f8f5ef,#f1ece4);padding:11px;border:1px solid rgba(220,211,198,.72)}.status small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:750}.status strong{display:block;font-size:12px;margin-top:5px;line-height:1.35}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--ok);box-shadow:0 0 0 3px rgba(47,125,92,.10)}.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(181,108,31,.11)}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(179,77,74,.11)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;background:linear-gradient(180deg,#f5ead1,#ead7af);color:#6d4924;border:1px solid #dfc99c}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--navy),#1c2c48);color:white;min-height:44px;box-shadow:0 8px 18px rgba(15,23,42,.13);transition:transform .15s ease}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:#ece6dc;color:var(--ink);box-shadow:none}.btn.ghost{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:none}
.section{margin-top:21px}.section-title,.panel-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:11px}.section-title h2,.panel-title h2{font-size:19px;letter-spacing:-.025em}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{min-height:118px;background:radial-gradient(circle at 85% 12%,rgba(200,154,75,.11),transparent 8rem),rgba(255,253,249,.95)}.kpi .big{font-size:28px;font-weight:900;letter-spacing:-.045em;margin-top:8px}.kpi .small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:750}.notice{border-left:4px solid var(--warn);background:#fff8e8;padding:13px 14px;border-radius:14px}.next-list,.list{display:grid;gap:0}.next,.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.next:last-child,.listrow:last-child{border-bottom:0}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(650px,calc(100% - 24px));background:rgba(10,18,31,.96);border:1px solid rgba(255,255,255,.08);border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;box-shadow:0 24px 60px rgba(8,15,27,.30);z-index:20;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#aeb7c5;border-radius:15px;padding:9px 4px;font-size:11px}.nav button.active{background:linear-gradient(180deg,#fff,#f4efe7);color:var(--navy);font-weight:850;box-shadow:0 8px 18px rgba(0,0,0,.15)}.tab-icon{display:block;font-size:18px;margin-bottom:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd4c7;background:#fff;border-radius:13px;padding:12px;font:inherit;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#bc9a69;box-shadow:0 0 0 3px rgba(188,154,105,.12)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cdbfae;border-radius:18px;background:rgba(255,255,255,.45)}
.modalback{position:fixed;inset:0;background:rgba(8,14,24,.64);display:grid;place-items:end center;padding:16px;z-index:30;backdrop-filter:blur(8px)}.modal{background:linear-gradient(180deg,#fffdf9,#f6f1e9);width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:28px;padding:19px;box-shadow:0 30px 90px rgba(0,0,0,.34)}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,rgba(200,154,75,.18),transparent 26rem),radial-gradient(circle at 100% 100%,rgba(185,121,87,.14),transparent 25rem),linear-gradient(145deg,#0a1220,#17243a 68%,#22324b)}.login{max-width:930px;width:100%;display:grid;grid-template-columns:1.12fr .88fr;gap:16px;align-items:stretch}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 80% 20%,rgba(211,173,103,.34),transparent 18rem),linear-gradient(140deg,#0a1220,#20304b 78%);color:#fff;border-radius:32px;padding:34px;box-shadow:0 28px 80px rgba(0,0,0,.28);min-height:480px;display:flex;flex-direction:column;justify-content:space-between}.hero:before{content:"";position:absolute;right:-80px;top:70px;width:310px;height:160px;border-radius:50%;border:1px solid rgba(255,255,255,.12);transform:rotate(-12deg)}.hero:after{content:"";position:absolute;right:-10px;bottom:-70px;width:280px;height:170px;border-radius:50%;border:1px solid rgba(255,255,255,.08);transform:rotate(8deg)}.hero p{color:#c6ced9;margin-top:10px;max-width:520px;line-height:1.6}.hero-preview{position:relative;z-index:1;margin-top:28px;padding:14px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}.hero-preview .minirow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.10)}.hero-preview .minirow:last-child{border-bottom:0}.hero-preview .minilabel{color:#aeb9c8;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.hero-preview strong{font-size:13px}.login>.card{border-radius:32px;padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 28px 80px rgba(0,0,0,.16)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#ece7de;border-radius:14px;padding:4px;margin:17px 0 20px}.auth-tabs button{border:0;border-radius:10px;background:transparent;padding:10px;font-weight:800;color:var(--muted)}.auth-tabs button.active{background:white;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.08)}.alert{margin-top:10px;border-radius:13px;padding:11px 12px;background:#fff6dd;font-size:13px}.alert.err{background:#fdebea;color:#8c3434}.alert.ok{background:#e9f5ee;color:#276047}.small{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}.quickgrid{display:grid;gap:9px}.quickcall{display:flex;justify-content:space-between;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:linear-gradient(180deg,#faf7f1,#f2ece3);border:1px solid var(--line);border-radius:15px;padding:13px 14px;min-height:58px}.quickcall strong{font-size:15px}.file-pill,.tag{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef1f5;color:#34445b}.attention{border-left:4px solid var(--warn);padding-left:11px}.verified{color:var(--ok)}.unverified{color:var(--warn)}.settingsline{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.settingsline:last-child{border-bottom:0}

.doc-stack{display:grid;gap:12px}.docslot{border:1px solid var(--line);border-radius:18px;padding:14px;background:linear-gradient(180deg,#fffdf9,#f7f2ea)}.docslot.emptydoc{background:rgba(255,255,255,.45);border-style:dashed}.dochead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.docmeta{font-size:12px;color:var(--muted);margin-top:4px}.docactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.docactions .btn{min-height:38px;padding:8px 11px;font-size:12px}.danger{background:#f7e8e6!important;color:#8f3e3b!important}.olderbox{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.olderbox summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--muted)}.doc-badge{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:999px;background:#e9f3ed;color:#2f6e52}.doc-badge.old{background:#eeeaf0;color:#6c5c72}.doc-empty-note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:5px}
@media(max-width:820px){.login{grid-template-columns:1fr;max-width:520px}.hero{min-height:auto;padding:28px}.hero-preview{margin-top:22px}}
@media(max-width:760px){.cars,.kpis,.form-grid{grid-template-columns:1fr}.shell{padding:12px 12px 100px}.card{padding:16px;border-radius:20px}.topbar{align-items:flex-start;padding:20px;border-radius:24px}.topbar .toolbar{justify-content:flex-end}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:1/-1}.kpi .big{font-size:24px}}
@media(max-width:430px){.status-grid{gap:6px}.status{padding:9px 7px}.status strong{font-size:11px}.brandmark{width:42px;height:42px}.topbar .toolbar{display:none}.hero{padding:24px}.login>.card{padding:20px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/+esm';

const sb=createClient('https://cmojpokknnkbrkbbvlqg.supabase.co','sb_publishable_WRSPjJMaco9Z0VC2SohzOA_RA9MMN5B');
const root=document.querySelector('#root');
let mode='login';
let state={session:null,household:null,vehicles:[],contacts:[],recurring:[],expenses:[],services:[],docs:[],reminders:[],tab:'home'};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n||0));
const fmtDate=d=>d?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d.slice(0,10)+'T12:00:00Z')):'To confirm';
const daysTo=d=>d?Math.ceil((new Date(d.slice(0,10)+'T23:59:59Z')-new Date())/86400000):null;
const level=d=>{const n=daysTo(d);if(n===null)return 'warn';if(n<0)return 'bad';if(n<=35)return 'warn';return ''};
const reg=id=>state.vehicles.find(v=>v.id===id)?.registration||'General';
function calc(){
 const monthlyRecurring=state.recurring.reduce((sum,x)=>sum+(x.cadence==='annual'?Number(x.amount||0)/12:Number(x.amount||0)),0);
 const now=new Date();
 const ym=now.toISOString().slice(0,7);
 const thisMonthExpenses=state.expenses.filter(x=>String(x.expense_date||'').slice(0,7)===ym).reduce((sum,x)=>sum+Number(x.amount||0),0);
 let avgExpenseMonth=0;
 if(state.expenses.length){
   const dates=state.expenses.map(x=>new Date(String(x.expense_date).slice(0,10)+'T12:00:00Z')).filter(d=>!Number.isNaN(d.getTime())).sort((a,b)=>a-b);
   if(dates.length){
     const first=dates[0];
     const months=Math.max(1,(now.getUTCFullYear()-first.getUTCFullYear())*12+(now.getUTCMonth()-first.getUTCMonth())+1);
     avgExpenseMonth=state.expenses.reduce((sum,x)=>sum+Number(x.amount||0),0)/months;
   }
 }
 const avg=monthlyRecurring+avgExpenseMonth;
 return {thisMonth:monthlyRecurring+thisMonthExpenses,avg,annual:avg*12};
}

function renderAuth(){
 root.innerHTML=`<div class="loginwrap"><div class="login">
   <div class="hero">
     <div><div class="eyebrow" style="color:#d8c6a5">Private family vehicle hub</div><h1 class="title" style="font-size:44px;margin-top:6px">Our Garage</h1><p class="sub">A private place for your household to keep vehicle dates, documents, costs and emergency contacts together.</p></div>
     <div class="hero-preview"><div class="minirow"><span class="minilabel">Access</span><strong>Household members only</strong></div><div class="minirow"><span class="minilabel">Documents</span><strong>Private signed access</strong></div><div class="minirow"><span class="minilabel">Membership</span><strong>Maximum 2 people</strong></div></div>
   </div>
   <div class="card"><div class="eyebrow">Secure access</div><h2 style="font-size:28px;letter-spacing:-.03em;margin-top:5px">${mode==='login'?'Sign in':'Join by invitation'}</h2><p class="sub">${mode==='login'?'Sign in to your private garage.':'You need the private invite code from the garage owner.'}</p>
     <div class="auth-tabs"><button id="loginTab" class="${mode==='login'?'active':''}">Sign in</button><button id="signupTab" class="${mode==='signup'?'active':''}">I have an invite</button></div>
     <form id="authForm"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="${mode==='login'?'current-password':'new-password'}" required placeholder="At least 8 characters"></div>${mode==='signup'?'<div class="field" style="margin-top:12px"><label>Private invite code</label><input id="signupCode" maxlength="20" required placeholder="Invite code from the owner"></div>':''}<button class="btn" id="authSubmit" style="width:100%;margin-top:16px">${mode==='login'?'Sign in to Our Garage':'Create invited account'}</button></form><div id="authMsg"></div><p class="small" style="margin-top:16px;text-align:center">An account alone does not grant access to garage data.</p>
   </div>
 </div></div>`;
 document.querySelector('#loginTab').onclick=()=>{mode='login';renderAuth()};
 document.querySelector('#signupTab').onclick=()=>{mode='signup';renderAuth()};
 document.querySelector('#authForm').onsubmit=async e=>{
   e.preventDefault();
   const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value,btn=document.querySelector('#authSubmit');
   let invite='';
   if(mode==='signup'){
     invite=document.querySelector('#signupCode').value.trim().toUpperCase();
     if(!invite){document.querySelector('#authMsg').innerHTML='<div class="alert err">An invite code is required.</div>';return}
     localStorage.setItem('ourGaragePendingInvite',invite);
   }
   btn.disabled=true;
   const res=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://lyledaniel-ux.github.io/our-garage/'}});
   btn.disabled=false;
   const msg=document.querySelector('#authMsg');
   if(res.error){if(mode==='signup')localStorage.removeItem('ourGaragePendingInvite');msg.innerHTML=`<div class="alert err">${esc(res.error.message)}</div>`;return}
   if(mode==='signup'&&!res.data.session){msg.innerHTML='<div class="alert ok">Account created. Confirm your email, then return to Our Garage and sign in. Your invite will be applied automatically.</div>';return}
   await route();
 };
}

function renderOnboarding(initialError=''){
 const pending=localStorage.getItem('ourGaragePendingInvite')||'';
 root.innerHTML=`<div class="loginwrap"><div class="login">
 <div class="hero"><div><div class="eyebrow" style="color:#aeb9c7">Invitation required</div><h1 class="title">Join Our Garage</h1><p class="sub">New garages cannot be created from this website. Only someone with the private invite code can join the existing garage.</p></div><div class="hero-preview"><div class="minirow"><span class="minilabel">Privacy</span><strong>No invite = no garage data</strong></div><div class="minirow"><span class="minilabel">Limit</span><strong>2 household members maximum</strong></div></div></div>
 <div class="card"><div class="field"><label>Private invite code</label><input id="code" maxlength="20" value="${esc(pending)}" placeholder="Enter code from garage owner"></div><button id="join" class="btn" style="width:100%;margin-top:12px">Join Our Garage</button><button id="signoutOnboard" class="btn secondary" style="width:100%;margin-top:9px">Sign out</button><div id="msg">${initialError?`<div class="alert err">${esc(initialError)}</div>`:''}</div><p class="small" style="margin-top:14px">For security, this garage stops accepting new members once two people have joined.</p></div></div></div>`;
 document.querySelector('#join').onclick=async()=>{const c=document.querySelector('#code').value.trim().toUpperCase();if(!c)return show('Enter the invite code first.',true);const r=await sb.rpc('join_garage',{p_invite_code:c});if(r.error)return show(r.error.message,true);localStorage.removeItem('ourGaragePendingInvite');await route()};
 document.querySelector('#signoutOnboard').onclick=async()=>{localStorage.removeItem('ourGaragePendingInvite');await sb.auth.signOut();await route()};
 function show(t,e=false){document.querySelector('#msg').innerHTML=`<div class="alert ${e?'err':'ok'}">${esc(t)}</div>`}
}

async function route(){
 const {data:{session}}=await sb.auth.getSession();state.session=session;
 if(!session){state.household=null;renderAuth();return}
 const q=await sb.from('household_members').select('household_id,role,households(id,name,invite_code)').eq('user_id',session.user.id).limit(1);
 if(q.error){root.innerHTML=`<div class="loginwrap"><div class="card"><h2>Could not load garage</h2><p class="sub">${esc(q.error.message)}</p></div></div>`;return}
 if(!q.data?.length){
   const pending=localStorage.getItem('ourGaragePendingInvite');
   if(pending){
     const jr=await sb.rpc('join_garage',{p_invite_code:pending});
     if(!jr.error){localStorage.removeItem('ourGaragePendingInvite');return route()}
     renderOnboarding(jr.error.message);return;
   }
   renderOnboarding();return;
 }
 state.household=q.data[0].households;await loadData();renderApp();
}

async function loadData(){
 const hid=state.household.id;
 const [v,c,r,e,s,d,rem]=await Promise.all([
   sb.from('vehicles').select('*').eq('household_id',hid).order('registration'),
   sb.from('emergency_contacts').select('*').eq('household_id',hid).order('sort_order'),
   sb.from('recurring_costs').select('*').eq('household_id',hid).eq('active',true),
   sb.from('expenses').select('*').eq('household_id',hid).order('expense_date',{ascending:false}).limit(100),
   sb.from('service_records').select('*').eq('household_id',hid).order('record_date',{ascending:false}).limit(100),
   sb.from('documents').select('*').eq('household_id',hid).order('created_at',{ascending:false}),
   sb.from('reminders').select('*').eq('household_id',hid).order('due_date')
 ]);
 const err=[v,c,r,e,s,d,rem].find(x=>x.error)?.error;if(err)throw err;

 const otherCard=d=>`<div class="docslot"><div class="dochead"><div><strong>${esc(d.label)}</strong><div class="docmeta">${esc(d.doc_type)} · ${fmtDate(d.created_at)}</div></div></div><div class="docactions"><button class="btn secondary viewDoc" data-id="${d.id}">View</button><button class="btn secondary downloadDoc" data-id="${d.id}">Download</button><button class="btn secondary replaceDoc" data-id="${d.id}">Replace</button><button class="btn secondary danger deleteDoc" data-id="${d.id}">Delete</button></div></div>`;

 }).join('')}</section>`;

function uploadDoc(preselectVehicle='',preselectType=''){
 const singletonTypes=['V5C','Insurance','MOT'];
 const selectedCar=state.vehicles.find(c=>c.id===preselectVehicle);
 const carField=selectedCar
   ? `<div class="field"><label>Car</label><div class="docslot" style="padding:11px 12px"><strong>${esc(selectedCar.registration)}</strong><div class="small">Vehicle locked for this upload</div></div><input type="hidden" name="vehicle_id" value="${selectedCar.id}"></div>`
   : `<div class="field"><label>Car</label><select name="vehicle_id">${state.vehicles.map(c=>`<option value="${c.id}">${esc(c.registration)}</option>`).join('')}</select></div>`;
 const el=modal(selectedCar?'Upload for '+selectedCar.registration:'Add private document',`<form id="f" class="form-grid section">${carField}<div class="field"><label>Type</label><select name="doc_type">${['V5C','Insurance','MOT','Service invoice','Receipt','Other'].map(x=>`<option ${x===preselectType?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>Label</label><input name="label" placeholder="e.g. V5C or 2026 insurance policy" required></div><div class="field" style="grid-column:1/-1"><label>PDF or photo</label><input type="file" name="file" accept=".pdf,image/*" required></div><div style="grid-column:1/-1"><div class="small">This file will be stored against <strong>${esc(selectedCar?.registration||'the selected vehicle')}</strong>. V5C, Insurance and MOT keep one current copy.</div></div><div><button class="btn">Upload securely</button></div></form>`);
 el.querySelector('#f').onsubmit=async e=>{
   e.preventDefault();
   const f=new FormData(e.target),file=f.get('file'),vid=f.get('vehicle_id'),type=f.get('doc_type'),label=f.get('label').trim();
   const vehicle=state.vehicles.find(c=>c.id===vid);
   if(!vehicle)return alert('Please choose a vehicle.');
   const existing=singletonTypes.includes(type)?state.docs.filter(d=>d.vehicle_id===vid&&d.doc_type===type&&d.storage_path).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0]:null;
   if(existing){
     if(!confirm(`${vehicle.registration} already has a current ${type}. Replace it with this file?`))return;
     const ok=await replaceDocument(existing.id,file,label);
     if(ok){el.remove();await refresh()}
     return;
   }
   const path=makeDocPath(vid,file.name);
   const up=await sb.storage.from('garage-docs').upload(path,file,{upsert:false});if(up.error)return alert(up.error.message);
   const r=await sb.from('documents').insert({household_id:state.household.id,vehicle_id:vid,doc_type:type,label,status:'uploaded',storage_path:path,uploaded_by:state.session.user.id});
   if(r.error){await sb.storage.from('garage-docs').remove([path]);return alert(r.error.message)}
   el.remove();await refresh();
 };
}
function makeDocPath(vehicleId,name){const safe=String(name||'document').replace(/[^a-zA-Z0-9._-]/g,'_');return state.household.id+'/'+vehicleId+'/'+Date.now()+'-'+safe}
async function openDoc(id){
 const d=state.docs.find(x=>x.id===id);if(!d?.storage_path)return alert('No file is stored for this document.');
 const r=await sb.storage.from('garage-docs').createSignedUrl(d.storage_path,300);if(r.error)return alert(r.error.message);
 window.location.href=r.data.signedUrl;
}
async function downloadDoc(id){
 const d=state.docs.find(x=>x.id===id);if(!d?.storage_path)return alert('No file is stored for this document.');
 const r=await sb.storage.from('garage-docs').download(d.storage_path);if(r.error)return alert(r.error.message);
 const url=URL.createObjectURL(r.data),a=document.createElement('a');a.href=url;a.download=(d.storage_path.split('/').pop()||d.label||'document').replace(/^\d+-/,'');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function replaceDoc(id){
 const d=state.docs.find(x=>x.id===id);if(!d)return;
 const el=modal('Replace '+(d.label||d.doc_type),`<form id="f" class="form-grid section"><div class="field" style="grid-column:1/-1"><label>Label</label><input name="label" value="${esc(d.label||'')}" required></div><div class="field" style="grid-column:1/-1"><label>New PDF or photo</label><input type="file" name="file" accept=".pdf,image/*" required></div><div style="grid-column:1/-1"><div class="notice">The new file will become the current copy. The old stored file will then be removed.</div></div><div><button class="btn">Replace document</button></div></form>`);
 el.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const ok=await replaceDocument(id,f.get('file'),f.get('label').trim());if(ok){el.remove();await refresh()}};
}
async function replaceDocument(id,file,label){
 const d=state.docs.find(x=>x.id===id);if(!d)return false;
 const path=makeDocPath(d.vehicle_id,file.name);
 const up=await sb.storage.from('garage-docs').upload(path,file,{upsert:false});if(up.error){alert(up.error.message);return false}
 const r=await sb.from('documents').update({label:label||d.label,status:'uploaded',storage_path:path,uploaded_by:state.session.user.id}).eq('id',id);
 if(r.error){await sb.storage.from('garage-docs').remove([path]);alert(r.error.message);return false}
 if(d.storage_path){const rm=await sb.storage.from('garage-docs').remove([d.storage_path]);if(rm.error)alert('The new copy is saved, but the old stored file could not be removed automatically: '+rm.error.message)}
 return true;
}
async function deleteDoc(id){
 const d=state.docs.find(x=>x.id===id);if(!d)return;
 if(!confirm(`Delete “${d.label}” permanently? This removes the stored file as well as the document entry.`))return;
 if(d.storage_path){const rm=await sb.storage.from('garage-docs').remove([d.storage_path]);if(rm.error)return alert('Could not remove the stored file: '+rm.error.message)}
 const r=await sb.from('documents').delete().eq('id',id);if(r.error)return alert(r.error.message);
 await refresh();
}
function renderSettings(){
 const el=modal('Garage settings',`<div class="settingsline"><div><strong>Garage</strong><div class="small">${esc(state.household.name)}</div></div></div><div class="settingsline"><div><strong>Invite code</strong><div class="small">Share this only with the second household member. It will stop working once two members have joined.</div></div><span class="plate">${esc(state.household.invite_code)}</span></div><div class="settingsline"><div><strong>Currency</strong><div class="small">GBP (£)</div></div></div><div class="settingsline"><div><strong>Signed in</strong><div class="small">${esc(state.session.user.email)}</div></div><button class="btn secondary" id="signout">Sign out</button></div>`);
 el.querySelector('#signout').onclick=async()=>{await sb.auth.signOut();el.remove();await route()};
}
async function refresh(){await loadData();renderApp()}
sb.auth.onAuthStateChange(()=>setTimeout(route,0));
route().catch(err=>{root.innerHTML=`<div class="loginwrap"><div class="card"><h2>Something went wrong</h2><p class="sub">${esc(err.message)}</p></div></div>`});
</script>
